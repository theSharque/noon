# Noon production — MySQL, Flyway, PHP-FPM, nginx, cron.
# Public HTTP via edge network only (container_name: noon-nginx).

networks:
  noon-network:
    driver: bridge
  edge:
    external: true

volumes:
  mysql_data:

services:
  mysql:
    image: mysql:5.7
    container_name: noon-mysql
    restart: unless-stopped
    command: >
      --character-set-server=utf8
      --collation-server=utf8_general_ci
      --sql_mode=NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/charset.cnf:/etc/mysql/conf.d/charset.cnf:ro
    networks:
      - noon-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  flyway:
    image: flyway/flyway:10
    container_name: noon-flyway
    command: -connectRetries=60 migrate
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8
      FLYWAY_USER: ${MYSQL_USER}
      FLYWAY_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./db/migration:/flyway/sql
      - ./db/flyway.conf:/flyway/conf/flyway.conf
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - noon-network

  php:
    image: noon-php:latest
    container_name: noon-php
    restart: unless-stopped
    environment:
      NOON_DB_HOST: mysql
      NOON_DB_USER: ${MYSQL_USER}
      NOON_DB_PASSWORD: ${MYSQL_PASSWORD}
      NOON_DB_NAME: ${MYSQL_DATABASE}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: "${EMAIL_FROM:-21noon <support@21noon.com>}"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://21noon.com}
    depends_on:
      flyway:
        condition: service_completed_successfully
    networks:
      - noon-network

  nginx:
    image: noon-nginx:latest
    container_name: noon-nginx
    restart: unless-stopped
    depends_on:
      - php
    networks:
      - noon-network
      - edge

  cron:
    image: noon-cron:latest
    container_name: noon-cron
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Moscow}
      NOON_DB_HOST: mysql
      NOON_DB_USER: ${MYSQL_USER}
      NOON_DB_PASSWORD: ${MYSQL_PASSWORD}
      NOON_DB_NAME: ${MYSQL_DATABASE}
    depends_on:
      flyway:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    networks:
      - noon-network
